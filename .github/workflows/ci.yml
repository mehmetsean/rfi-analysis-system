name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict src tests benchmarks
      - run: pytest --cov=rfikit --cov-report=term-missing --cov-fail-under=90
      - run: python scripts/build_heldout.py --check
      - run: python scripts/make_measured.py --check
      - run: python scripts/make_examples.py --check
      - run: python benchmarks/bench.py --quick

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install ".[browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build_site.py
      - run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory _site &
          curl --silent --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/ > /dev/null
          pytest tests_browser
        env:
          RFIKIT_DEMO_URL: http://127.0.0.1:8000/

  ci:
    name: ci
    needs: [test, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success" && test "${{ needs.browser.result }}" = "success"
