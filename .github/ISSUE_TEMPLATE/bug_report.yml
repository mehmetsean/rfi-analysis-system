name: Bug report
description: Something is wrong or a check fails
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Say what you did and what you expected.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact rfikit command, or the text you pasted in the demo.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: rfikit version and Python version
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the error or the lines that look wrong. Do not paste real company data.
